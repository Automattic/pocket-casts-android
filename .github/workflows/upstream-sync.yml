name: Upstream release sync

on:
  schedule:
    # Weekly on Mondays at 10:00 UTC. Upstream releases mostly land Fridays;
    # preflight no-ops when already synced.
    - cron: '0 10 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: Automattic/pocket-casts-android
      BASE_BRANCH: main
      AURIS_CUSTOMIZATION_HINT: >-
        Preserve ALL Auris-specific customizations (voice module, wake word,
        on-device ASR/intent routing, and related assets under modules/services/voice/).
        Prefer upstream changes everywhere else. Do not delete Auris-only modules or features.

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preflight
        id: preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./scripts/upstream-sync-preflight.sh
          ./scripts/upstream-sync-preflight.sh

      - name: Prepare upstream merge
        id: prepare
        if: steps.preflight.outputs.proceed == 'true'
        env:
          SYNC_TAG: ${{ steps.preflight.outputs.tag }}
          SYNC_COMMIT: ${{ steps.preflight.outputs.commit }}
          SYNC_BRANCH: ${{ steps.preflight.outputs.branch }}
        run: |
          chmod +x ./scripts/upstream-sync-prepare.sh
          ./scripts/upstream-sync-prepare.sh

      - name: Validate Pi configuration
        if: steps.preflight.outputs.proceed == 'true' && steps.prepare.outputs.merge_conflicts == 'true'
        run: |
          test -n "${{ secrets.PI_PROVIDER || vars.PI_PROVIDER }}" || { echo "PI_PROVIDER is not set"; exit 1; }
          test -n "${{ secrets.PI_MODEL || vars.PI_MODEL }}" || { echo "PI_MODEL is not set"; exit 1; }
          test -n "${{ secrets.PI_API_KEY }}" || { echo "PI_API_KEY is not set"; exit 1; }

      - name: Resolve merge conflicts with Pi
        id: pi
        if: steps.preflight.outputs.proceed == 'true' && steps.prepare.outputs.merge_conflicts == 'true'
        uses: shaftoe/pi-coding-agent-action@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          provider: ${{ secrets.PI_PROVIDER || vars.PI_PROVIDER }}
          model: ${{ secrets.PI_MODEL || vars.PI_MODEL }}
          token: ${{ secrets.PI_API_KEY }}
          auto_compaction: true
          export_session_jsonl: true
          prompt: |
            Resolve merge conflicts from upstream Pocket Casts release `${{ steps.preflight.outputs.tag }}`.

            Work ONLY in this worktree (do not touch the main checkout):
            `${{ steps.prepare.outputs.worktree_root }}`

            Upstream repository: `${{ env.UPSTREAM_REPO }}`
            Upstream release tag: `${{ steps.preflight.outputs.tag }}`
            Sync branch: `${{ steps.preflight.outputs.branch }}`

            Rules:
            - ${AURIS_CUSTOMIZATION_HINT}
            - **Include upstream `.github/` changes** (workflows, actions, templates). Do NOT revert or strip `.github/` files to match old Auris main.
            - Resolve every conflict marker and unmerged path.
            - Stage all resolved files and commit with message: `chore(upstream): merge release ${{ steps.preflight.outputs.tag }}`
            - Do NOT push or open a PR (a later step handles that).
            - Do NOT remove the worktree (a later step needs it).

            Do not run full builds unless required to validate a conflict resolution.

      - name: Log Pi agent response
        if: steps.preflight.outputs.proceed == 'true' && steps.prepare.outputs.merge_conflicts == 'true'
        env:
          # Use env (not ${{ }} interpolation in the script body) so multiline
          # responses with quotes/backticks/parens do not break the shell.
          PI_RESPONSE: ${{ steps.pi.outputs.response }}
          PI_SUCCESS: ${{ steps.pi.outputs.success }}
        run: |
          echo "::group::Pi agent response"
          printf '%s\n' "$PI_RESPONSE"
          echo "::endgroup::"
          if [ "$PI_SUCCESS" != "true" ]; then
            echo "::warning::Pi agent did not report success (success=${PI_SUCCESS})"
          fi

      - name: Finalize sync and open PR
        id: finalize
        if: always() && steps.preflight.outputs.proceed == 'true' && steps.prepare.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SYNC_PAT: ${{ secrets.UPSTREAM_SYNC_PAT }}
          PI_RESPONSE: ${{ steps.pi.outputs.response }}
          PI_SUCCESS: ${{ steps.pi.outputs.success }}
        run: |
          chmod +x ./scripts/upstream-sync-audit.sh ./scripts/upstream-sync-finalize.sh
          ./scripts/upstream-sync-finalize.sh

      - name: Sync incomplete
        if: steps.preflight.outputs.proceed == 'true' && steps.finalize.outputs.has_unresolved_conflicts == 'true'
        run: |
          echo "::error::Upstream sync has unresolved merge conflicts. See the PR and workflow logs."
          exit 1

      - name: Push failed
        if: steps.preflight.outputs.proceed == 'true' && steps.finalize.outputs.push_succeeded != 'true'
        run: |
          echo "::error::Upstream sync branch could not be pushed. See the PR body and workflow logs."
          exit 1

      - name: Workflow files deferred
        if: steps.preflight.outputs.proceed == 'true' && steps.finalize.outputs.workflows_deferred == 'true'
        run: |
          echo "::warning::.github/workflows/ changes were deferred — apply the patch from the PR or workflow artifact manually."
          exit 1

      - name: Upload deferred workflow patch
        if: steps.preflight.outputs.proceed == 'true' && steps.finalize.outputs.workflows_deferred == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: upstream-sync-workflows-patch
          path: ${{ runner.temp }}/upstream-sync/github-workflows.patch
          if-no-files-found: ignore

      - name: Upload Pi session JSONL
        if: steps.preflight.outputs.proceed == 'true' && steps.prepare.outputs.merge_conflicts == 'true' && steps.pi.outputs.session_jsonl_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: upstream-sync-pi-session
          path: ${{ steps.pi.outputs.session_jsonl_path }}
          if-no-files-found: ignore
