    command: "bash .buildkite/commands/verify-trunk-skips.sh {{matrix}}"
    agents: { queue: upload }
    plugins: [automattic/a8c-ci-toolkit#bbe3bcfbdf9cbf3965567769e9b853b9db2860d1]
    matrix: [docs, code]
