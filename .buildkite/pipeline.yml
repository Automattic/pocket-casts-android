# Verification PR only; do not merge. The production pipeline is rendered, never uploaded.
steps:
  - label: "Verify trunk skip/upload: {{matrix}}"
    command: "bash .buildkite/commands/verify-trunk-skips.sh {{matrix}}"
    agents: { queue: upload }
    plugins: [automattic/a8c-ci-toolkit#8.0.1]
    matrix: [docs, code]
