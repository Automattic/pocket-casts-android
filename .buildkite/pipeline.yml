# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
---

# [DO NOT MERGE] Every other step is deliberately stripped so this branch answers one
# question in a couple of minutes instead of running a full Android build.

steps:
  # Runs on the `upload` queue because that is the agent that interpolates
  # `.buildkite/release-pipelines/*.yml` before the release jobs ever start.
  - label: ":test_tube: Validate Buildkite interpolation"
    command: |
      .buildkite/commands/validate-interpolation.sh

      export PROBE_SET=beta
      export PROBE_EMPTY=

      echo '--- :mag: Escaped guard, evaluated by the job shell'

      echo "VAR set:   [$${PROBE_SET:?Missing value}]"

      if err=$$( ( echo "$${PROBE_UNSET:?Missing value}" ) 2>&1 ); then
        echo "FAIL: unset VAR did not trip the guard"
        exit 1
      fi
      echo "VAR unset: guard tripped -> $$err"

      if err=$$( ( echo "$${PROBE_EMPTY:?Missing value}" ) 2>&1 ); then
        echo "FAIL: empty VAR did not trip the guard"
        exit 1
      fi
      echo "VAR empty: guard tripped -> $$err"

      echo "all runtime assertions held"
    agents:
      queue: upload
